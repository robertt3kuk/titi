[package]
name = "titi-core"
version.workspace = true
edition.workspace = true
license.workspace = true


[dependencies]
titi-providers = { workspace = true }
titi-tools = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
# Audited AEAD (RustCrypto). Default features off: `getrandom` is not needed,
# the share key comes from the system entropy pool directly.
chacha20poly1305 = { version = "0.11", default-features = false, features = [
    "alloc",
] }

[dev-dependencies]
tempfile = "3"
