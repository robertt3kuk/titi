[package]
name = "titi-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "titi"
path = "src/main.rs"

[dependencies]
titi-core = { workspace = true }
titi-engine = { workspace = true }
titi-providers = { workspace = true }
titi-config = { workspace = true }
titi-secrets = { workspace = true }
titi-tools = { workspace = true }
titi-genome = { workspace = true }
titi-memory = { workspace = true }
titi-tui = { workspace = true }
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
ratatui = "0.30.2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
