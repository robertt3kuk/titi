[package]
name = "titi-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
titi-config = { workspace = true }
titi-core = { workspace = true }
titi-providers = { workspace = true }
titi-secrets = { workspace = true }
titi-tools = { workspace = true }
titi-genome = { workspace = true }
titi-soul = { workspace = true }
titi-memory = { workspace = true }
futures = "0.3"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
smol_str = { version = "0.3", features = ["serde"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }
