[workspace]
resolver = "3"
members = [
    "crates/titi-core",
    "crates/titi-config",
    "crates/titi-soul",
    "crates/titi-memory",
    "crates/titi-providers",
    "crates/titi-engine",
    "crates/titi-tools",
    "crates/titi-genome",
    "crates/titi-secrets",
    "crates/titi-tui",
      "crates/titi-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/robertt3kuk/titi"

[workspace.dependencies]
titi-config = { path = "crates/titi-config" }
titi-core = { path = "crates/titi-core" }
titi-engine = { path = "crates/titi-engine" }
titi-providers = { path = "crates/titi-providers" }
titi-soul = { path = "crates/titi-soul" }
titi-memory = { path = "crates/titi-memory" }
titi-secrets = { path = "crates/titi-secrets" }
titi-tools = { path = "crates/titi-tools" }
titi-genome = { path = "crates/titi-genome" }
titi-tui = { path = "crates/titi-tui" }
tree-sitter = "0.24"
portable-pty = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
strip = "symbols"
